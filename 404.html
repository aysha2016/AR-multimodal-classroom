    <!-- Trailing Slash Enforcer for GitHub Pages and Subfolder Deployments -->
    <script>
      (function() {
        try {
          var path = window.location.pathname;
          var host = window.location.hostname;
          if (host.includes('github.io')) {
            // Enforce trailing slash on repository directory paths so relative assets './assets/...' resolve properly
            if (path && !path.endsWith('/') && !path.split('/').pop().includes('.')) {
              window.location.replace(window.location.origin + path + '/' + window.location.search + window.location.hash);
            }
          }
        } catch (e) {
          console.warn('Path check error:', e);
        }
      })();
    </script>
