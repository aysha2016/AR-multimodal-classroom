<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SmartClass AI</title>
    <meta name="description" content="Premium Augmented Classroom with Realistic AI Avatar Teacher, 3D simulations, and adaptive tutoring." />
    <meta property="og:title" content="SmartClass AI" />
    <meta property="og:description" content="Premium Augmented Classroom with Realistic AI Avatar Teacher, 3D simulations, and adaptive tutoring." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  </head>
  <body class="bg-slate-50 text-slate-900 font-sans antialiased overflow-x-hidden selection:bg-blue-600 selection:text-white">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      // Fallback for static GitHub Pages branch deployments (when repository root / is served unbuilt)
      (function() {
        if (typeof window !== 'undefined' && window.location.hostname.endsWith('github.io') && !window.location.pathname.includes('/dist')) {
          var scripts = document.getElementsByTagName('script');
          for (var i = 0; i < scripts.length; i++) {
            if (scripts[i].src && scripts[i].src.indexOf('main.tsx') !== -1) {
              var repoBase = window.location.pathname.replace(/\/+$/, '');
              window.location.replace(repoBase + '/dist/' + window.location.search + window.location.hash);
              break;
            }
          }
        }
      })();
    </script>
  </body>
</html>
